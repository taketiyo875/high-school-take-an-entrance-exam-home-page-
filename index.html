<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おすすめメニュー</title>
    <style>
        /* 全体の基本設定（白背景） */
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 見出し（おすすめメニュー） */
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #222222;
        }

        /* グリッド配置（横3マス、縦は自動で増える） */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 750px;
            box-sizing: border-box;
            margin-bottom: 40px;
        }

        /* スマートフォンなどの狭い画面用 */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }

        /* 正方形の基本カード設定 */
        .card {
            border-radius: 12px;
            text-decoration: none;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            aspect-ratio: 1 / 1; /* 正方形を維持 */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        /* ホバー時の演出（少し浮き上がる） */
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
        }

        /* 薄いクリーム色のボタン */
        .card.cream {
            background-color: #fffdf0;
            border: 2px solid #f3eed1;
        }

        /* 薄いピンク色のボタン（メインオプチャ） */
        .card.pink {
            background-color: #fff0f5;
            border: 2px solid #fbe2eb;
        }

        /* 薄いワインレッドのボタン（大学受験オプチャ） */
        .card.winered {
            background-color: #fcf0f2;
            border: 2px solid #f5dae1;
        }

        /* 薄いサーモンピンクのボタン（数学専門部屋） */
        .card.salmon {
            background-color: #fff6f0;
            border: 2px solid #faddcd;
        }

        /* 薄いオレンジのボタン（英語対策部屋） */
        .card.orange {
            background-color: #fffaf0;
            border: 2px solid #faebd7;
        }

        /* ボタンの文字デザイン */
        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* 誘導テキスト */
        .card-lead {
            font-size: 10px;
            color: #b33e5c;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* 教科特化部屋用の強い強調テキスト */
        .card-highlight {
            font-size: 9px;
            color: #dd4b39;
            font-weight: bold;
            border: 1px solid #dd4b39;
            padding: 2px 4px;
            border-radius: 4px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        /* 気の利くメッセージ（サブテキスト） */
        .card-desc {
            font-size: 11px;
            color: #666666;
            line-height: 1.4;
        }

        /* 青い雲のメッセージ設定 */
        .cloud-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 260px;
            height: 100px;
            box-sizing: border-box;
        }

        /* SVGで綺麗な雲の輪郭を描画 */
        .cloud-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .cloud-text {
            position: relative;
            z-index: 2;
            color: #0066cc;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 見出し -->
    <div class="title">おすすめメニュー</div>

    <!-- グリッド（3列配置） -->
    <div class="grid-container">
        
        <!-- 1つ目：コラム -->
        <a href="https://green-radium-99e.notion.site/33f06cebba0180d19b5ec3e684bb0b3b?source=copy_link" target="_blank" class="card cream">
            <div class="card-title">コラム</div>
        </a>

        <!-- 2つ目：受験体験記 -->
        <a href="https://green-radium-99e.notion.site/33106cebba018027965bf563a75de9f2?v=33106cebba0180a4b02f000c1fd9a126&source=copy_link" target="_blank" class="card cream">
            <div class="card-title">受験体験記</div>
        </a>

        <!-- 3つ目：カウントダウン -->
        <a href="https://snowstudy.github.io/countdown/" target="_blank" class="card cream">
            <div class="card-title">カウントダウン</div>
        </a>

        <!-- 4つ目：公式オープンチャット（メイン） -->
        <a href="https://line.me/ti/g2/FO_lamKFGjpzilzUOkU4xCCPnGbRNbl558hpww?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" class="card pink">
            <div class="card-title">公式オープンチャット</div>

                ・仲間とがんばる！<br>
                ・質問・相談OK<br>
                ・みんなで合格🌸
            </div>
        </a>

        <!-- 5つ目：高校生勉強会（大学受験） -->
        <a href="https://line.me/ti/g2/KQjlfiPYg9aO-o_MpQvlEABZ4gcoGq40KJU3rg?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" class="card winered">
            <div class="card-lead">高校生の方はこちらも!</div>
            <div class="card-title">大学受験対策部屋</div>
            <div class="card-desc">
                ・目指せ志望校突破！<br>
                ・大学受験のサポート<br>
                ・次のステージへ一歩
            </div>
        </a>

        <!-- 6つ目：数学専門部屋 -->
        <a href="https://line.me/ti/g2/iqhlogccPd8n3b8EiYkNzauR2Ah-lkqWT15BHA?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" class="card salmon">
            <div class="card-highlight">苦手克服・得意を伸ばす!教科特化型部屋</div>
            <div class="card-title">数学専門部屋🎓</div>
            <div class="card-desc">
                ・基礎から応用まで！<br>
                ・他教科の質問もOK<br>
                ・みんなで教え合おう
            </div>
        </a>

        <!-- 7つ目：英語対策部屋 -->
        <a href="https://line.me/ti/g2/Zqa4jopexWSL6Bkc2N9iTiPZvtDVcZsRfaQd7g?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" class="card orange">
            <div class="card-highlight">苦手克服・得意を伸ばす!教科特化型部屋</div>
            <div class="card-title">英語対策部屋📝</div>
            <div class="card-desc">
                ・定期テスト対策も！<br>
                ・英検や高校入試に<br>
                ・わかるまで丁寧に
            </div>
        </a>

    </div>

    <!-- 青色の輪郭の雲とメッセージ -->
    <div class="cloud-container">
        <svg class="cloud-bg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 15 65 
                     A 15 15 0 0 1 28 35 
                     A 22 22 0 0 1 72 32 
                     A 15 15 0 0 1 85 55 
                     A 12 12 0 0 1 80 75 
                     A 10 10 0 0 1 50 80
                     A 15 15 0 0 1 15 75 Z" 
                  fill="#ffffff" stroke="#0066cc" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <div class="cloud-text">一歩一歩進んでいこう。</div>
    </div>

</body>
</html>
