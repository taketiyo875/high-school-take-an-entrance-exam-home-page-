<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポータルサイト</title>
    <style>
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .section {
            width: 100%;
            max-width: 500px;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #222222;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            border-radius: 12px;
            text-decoration: none;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
        }

        .card.cream {
            background-color: #fffdf0;
            border: 2px solid #f3eed1;
        }

        .card.pink {
            background-color: #fff0f5;
            border: 2px solid #fbe2eb;
        }

        .card.winered {
            background-color: #fcf0f2;
            border: 2px solid #f5dae1;
        }

        .card.salmon {
            background-color: #fff6f0;
            border: 2px solid #faddcd;
        }

        .card.orange {
            background-color: #fffaf0;
            border: 2px solid #faebd7;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card-lead {
            font-size: 10px;
            color: #b33e5c;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card-highlight {
            font-size: 9px;
            color: #dd4b39;
            font-weight: bold;
            border: 1px solid #dd4b39;
            padding: 2px 4px;
            border-radius: 4px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .card-desc {
            font-size: 11px;
            color: #666666;
            line-height: 1.4;
        }

        .cloud-card {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
        }

        .cloud-bg {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            z-index: 1;
        }

        .cloud-text {
            position: relative;
            z-index: 2;
            color: #0066cc;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- セクション1：おすすめメニュー -->
    <div class="section">
        <div class="title">おすすめメニュー</div>
        <div class="grid-container">
            
            <!-- コラム -->
            <a href="https://notion.site" target="_blank" class="card cream">
                <div class="card-title">コラム</div>
            </a>

            <!-- 受験体験記 -->
            <a href="https://notion.site" target="_blank" class="card cream">
                <div class="card-title">受験体験記</div>
            </a>

            <!-- カウントダウン -->
            <a href="https://github.io" target="_blank" class="card cream">
                <div class="card-title">カウントダウン</div>
            </a>

            <!-- 青い雲のメッセージ -->
            <div class="cloud-card">
                <svg class="cloud-bg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M 20 65 
                             A 15 15 0 0 1 32 35 
                             A 20 20 0 0 1 68 30 
                             A 15 15 0 0 1 85 50 
                             A 12 12 0 0 1 80 75 
                             A 10 10 0 0 1 55 80
                             A 15 15 0 0 1 20 75 Z" 
                          fill="#ffffff" stroke="#0066cc" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <div class="cloud-text">一歩一歩<br>進んでいこう。</div>
            </div>

        </div>
    </div>

    <!-- セクション2：公式オープンチャット -->
    <div class="section">
        <div class="title">公式オープンチャット</div>
        <div class="grid-container">
            
            <!-- メインオプチャ -->
            <a href="https://line.me" target="_blank" class="card pink">
                <div class="card-title">高校受験生勉強会.ᐟ.ᐟ.ᐟ</div>
                <div class="card-desc">
                    ・仲間とがんばる！<br>
                    ・質問・相談OK<br>
                    ・みんなで合格🌸
                </div>
            </a>

            <!-- 大学受験 -->
            <a href="https://line.me" target="_blank" class="card winered">
                <div class="card-lead">高校生の方はこちらも!</div>
                <div class="card-title">大学受験対策部屋</div>
                <div class="card-desc">
                    ・目指せ志望校突破！<br>
                    ・大学受験のサポート<br>
                    ・次のステージへ一歩
                </div>
            </a>

            <!-- 数学 -->
            <a href="https://line.me" target="_blank" class="card salmon">
                <div class="card-highlight">苦手克服・得意を伸ばす!教科特化型部屋</div>
                <div class="card-title">数学専門部屋🎓</div>
                <div class="card-desc">
                    ・基礎から応用まで！<br>
                    ・他教科の質問もOK<br>
                    ・みんなで教え合おう
                </div>
            </a>

            <!-- 英語 -->
            <a href="https://line.me" target="_blank" class="card orange">
                <div class="card-highlight">苦手克服・得意を伸ばす!教科特化型部屋</div>
                <div class="card-title">英語対策部屋📝</div>
                <div class="card-desc">
                    ・定期テスト対策も！<br>
                    ・英検や高校入試に<br>
                    ・わかるまで丁寧に
                </div>
            </a>

        </div>
    </div>

</body>
</html>
